CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_KSCAN_DIRECT_POLLING=y

# Napájení externích periferií (Nice!Nano V2)
CONFIG_ZMK_EXT_POWER=y

# Aktivace displeje a LVGL subsystému
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
#CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
#CONFIG_SSD1306_SH1106_COMPATIBLE=y

# Povolení sériové linky a USB logování
CONFIG_SERIAL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_UART_CONSOLE=y
CONFIG_ZMK_USB_LOGGING=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=5000
#CONFIG_LOG=y
#CONFIG_LOG_BACKEND_UART=y

# Dočasná diagnostika: přímý text do konzole + samostatná zpráva loggeru.
# PRINTK nesmí být přesměrován přes logger, jinak by nešlo obě cesty odlišit.
#CONFIG_PRINTK=y
#CONFIG_LOG_PRINTK=n
#CONFIG_MACROPAD_USB_DIAGNOSTICS=y
#CONFIG_DISPLAY_LOG_LEVEL_DBG=y